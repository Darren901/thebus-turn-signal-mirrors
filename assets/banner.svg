<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="TurnSignalMirrors — HUD mirrors that appear only when you signal">
  <title>TurnSignalMirrors for The Bus</title>
  <style>
    .title { font: 800 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
    .sub   { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F5D312; letter-spacing: 3px; }
    .tag   { font: 400 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9aa3b2; }
    .lbl   { font: 700 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #6b7383; letter-spacing: 2px; }

    /* 8s cycle: 0–50% left signal, 50–100% right signal */
    .phaseL { animation: phaseL 8s infinite; }
    .phaseR { animation: phaseR 8s infinite; }
    @keyframes phaseL { 0%, 44% { opacity: 1; } 50%, 96% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes phaseR { 0%, 46% { opacity: 0; } 52%, 94% { opacity: 1; } 100% { opacity: 0; } }

    .blink { animation: blink 0.8s steps(1, end) infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

    .dash { animation: dash 0.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -60; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#1c2027"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d8fd0"/>
      <stop offset="1" stop-color="#d9e6f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3BE36B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3BE36B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mirrorClip"><rect x="0" y="0" width="190" height="130" rx="14"/></clipPath>

    <!-- Rear view as seen in a left-side mirror: road recedes toward the right edge -->
    <g id="viewL">
      <rect width="190" height="130" fill="url(#sky)"/>
      <rect y="62" width="190" height="68" fill="#3d4148"/>
      <rect y="58" width="190" height="6" fill="#4f7a43"/>
      <path d="M0 130 L0 92 L160 62 L190 62 L190 130 Z" fill="#2a2d33"/>
      <line x1="40" y1="130" x2="172" y2="64" stroke="#f2f2f2" stroke-width="3" stroke-dasharray="14 16" class="dash"/>
      <rect x="122" y="70" width="34" height="20" rx="5" fill="#c8312b"/>
      <rect x="126" y="73" width="26" height="8" rx="2" fill="#9cc3e6"/>
      <circle cx="129" cy="91" r="4" fill="#111"/><circle cx="150" cy="91" r="4" fill="#111"/>
      <rect x="0" y="0" width="38" height="130" fill="#F5D312" opacity="0.92"/>
      <rect x="0" y="0" width="38" height="130" fill="#000" opacity="0.15"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- Perspective road lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <line x1="640" y1="320" x2="980" y2="0"/>
    <line x1="1280" y1="320" x2="980" y2="0"/>
    <line x1="400" y1="320" x2="980" y2="0"/>
  </g>
  <line x1="960" y1="320" x2="980" y2="0" stroke="#F5D312" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="26 22" class="dash"/>

  <!-- Bus-yellow accent bar -->
  <rect x="0" y="306" width="1280" height="14" fill="#F5D312"/>
  <rect x="56" y="70" width="8" height="150" rx="4" fill="#F5D312"/>

  <!-- Text -->
  <text x="84" y="108" class="sub">THE BUS · UE4SS MOD</text>
  <text x="80" y="176" class="title">TurnSignalMirrors</text>
  <text x="84" y="216" class="tag">HUD mirrors that show up only when you signal.</text>

  <!-- Left mirror -->
  <g transform="translate(690 92)">
    <rect width="190" height="130" rx="14" fill="none" stroke="#3a3f4a" stroke-width="2" stroke-dasharray="6 8"/>
    <g class="phaseL">
      <rect x="-6" y="-6" width="202" height="142" rx="18" fill="#F5D312" opacity="0.18"/>
      <g clip-path="url(#mirrorClip)"><use href="#viewL"/></g>
      <rect width="190" height="130" rx="14" fill="none" stroke="#F5D312" stroke-width="3"/>
    </g>
    <text x="95" y="158" text-anchor="middle" class="lbl">LEFT</text>
  </g>

  <!-- Right mirror (horizontally flipped view) -->
  <g transform="translate(1050 92)">
    <rect width="190" height="130" rx="14" fill="none" stroke="#3a3f4a" stroke-width="2" stroke-dasharray="6 8"/>
    <g class="phaseR">
      <rect x="-6" y="-6" width="202" height="142" rx="18" fill="#F5D312" opacity="0.18"/>
      <g transform="translate(190 0) scale(-1 1)">
        <g clip-path="url(#mirrorClip)"><use href="#viewL"/></g>
      </g>
      <rect width="190" height="130" rx="14" fill="none" stroke="#F5D312" stroke-width="3"/>
    </g>
    <text x="95" y="158" text-anchor="middle" class="lbl">RIGHT</text>
  </g>

  <!-- Indicator arrows -->
  <g transform="translate(970 157)">
    <!-- unlit arrows -->
    <path d="M-66 0 L-40 -24 L-40 -11 L-18 -11 L-18 11 L-40 11 L-40 24 Z" fill="#232831" stroke="#353b46" stroke-width="2"/>
    <path d="M66 0 L40 -24 L40 -11 L18 -11 L18 11 L40 11 L40 24 Z" fill="#232831" stroke="#353b46" stroke-width="2"/>
    <!-- lit left -->
    <g class="phaseL"><g class="blink">
      <circle cx="-42" cy="0" r="44" fill="url(#glow)"/>
      <path d="M-66 0 L-40 -24 L-40 -11 L-18 -11 L-18 11 L-40 11 L-40 24 Z" fill="#3BE36B"/>
    </g></g>
    <!-- lit right -->
    <g class="phaseR"><g class="blink">
      <circle cx="42" cy="0" r="44" fill="url(#glow)"/>
      <path d="M66 0 L40 -24 L40 -11 L18 -11 L18 11 L40 11 L40 24 Z" fill="#3BE36B"/>
    </g></g>
  </g>
</svg>
